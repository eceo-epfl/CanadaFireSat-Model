_target_: experiments.concept_bottleneck.bottleneck.probe.SAEProbe
sae_folder_path: ""
sae_epoch_num: ""
sae_ckpt_path: ${paths.log_dir}/train-sae/runs/${probe.sae_folder_path}/checkpoints/${probe.sae_epoch_num}.ckpt
alive_mask_path: ${paths.log_dir}/train-sae/runs/${probe.sae_folder_path}/alive_mask.pt
num_classes: 1
loss_config:
    pos_weight: 6.7
    loss_type: combined_dice_ce
threshold: 0.5
l1_lambda: 1e-4
weight_decay: 0.
optimizer_type: adam
scheduler_type: "warmup_cosine"
sparsity_eps: 1e-6
out_H: ${MODEL.out_H}
out_W: ${MODEL.out_W}
sae_load_device: "cuda"
scheduler_kwargs:
    warmup_epochs: 2
    lr_base: 5e-6 # Check what is used as BASE in MS-CLIP.
    lr_min: 1e-7
    lr_start: 1e-7
