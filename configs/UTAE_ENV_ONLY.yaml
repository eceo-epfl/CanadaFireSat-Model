defaults:
  - _self_
  - global_config

MODEL:
  architecture:  "UTAE"
  mid_input_res: 32
  low_input_res: 32 # Placeholder
  era_ratio: 22.264
  input_dim: 15
  out_H: 24
  out_W: 24
  threshold: 0.5
  num_classes: 2

SOLVER:
  num_epochs: 20
  num_warmup_epochs: 2
  pos_weight: 6.7
  loss_function:  combined_dice_ce
  lr_scheduler: 'cosine'
  lr_base: 5e-6
  lr_min: 1e-7
  lr_start: 1e-7
  num_cycles: 1
  weight_decay: 0.01
  accumulate_grad_batches: 1
  interval: "epoch"

### Leveraging RAW *.npy files ###
DATASETS:
  kwargs:
    stats_dir: "${paths.pos_env_spa}"
    tab_dir: ["${paths.pos_env_spa}", "${paths.neg_env_spa}"]
    with_loc: False
    with_doy: True
    is_spatial: True
    nan_value: "median"
    is_temp: False
    # bands: possibility to specify the selected bands.
  train:
    paths: "${paths.split}"
    label_dir: "${paths.label}"
    batch_size: 24
    num_workers: 8

  eval:
    paths: "${paths.split}"
    label_dir: "${paths.label}"
    batch_size: 24
    num_workers: 8

  test:

