defaults:
  - global_config
  - probe: default.yaml
  - _self_

device: "cuda"
seed: 42

# Base MS-CLIP model
model_ckpt: "MIXLOSS_HIGHLR10X_VPT_SITS_ONLY/MSClipFacto-18-f1-0.48.ckpt"
model_path: "${paths.root_dir}/results/models/${model_ckpt}"
config_name: "config_file.yaml"

# Trained probe checkpoint. The probe configuration below points to its frozen SAE.
probe_checkpoint_path: "${paths.log_dir}/train-probe/runs/2026-10-22_08-27-40/checkpoints/epoch_017.ckpt"
probe:
  sae_ckpt_path: "${paths.log_dir}/train-sae/runs/2026-10-14_08-40-46/checkpoints/epoch_017.ckpt"
  alive_mask_path: "${paths.log_dir}/train-sae/runs/2026-10-14_08-40-46/alive_mask.pt"

MODEL:
  architecture: "MSClipFacto"
  out_H: 26
  out_W: 26
  input_img_res: 264
  img_res: 260
  test_max_seq_len: null

DATASETS:
  kwargs:
    mean_file: "${paths.msclip_bands_mean}"
    std_file: "${paths.msclip_bands_std}"
    with_loc: False
    with_doy: True
    use_msclip_norm: True
    trans_type: "msclip"
    bands:
      - B2
      - B3
      - B4
      - B5
      - B6
      - B7
      - B8
      - B8A
      - B11
      - B12
  train:
    paths: "${paths.split}"
    base_dir: ["${paths.pos_sits}", "${paths.neg_sits}"]
    label_dir: "${paths.label}"
    batch_size: 24
    num_workers: 8
  eval:
    paths: "${paths.split}"
    base_dir: ["${paths.pos_sits}", "${paths.neg_sits}"]
    label_dir: "${paths.label}"
    batch_size: 1
    num_workers: 1
    hard: False

# Optional CSV with a `term` column matching the SAE vocabulary embedding order.
vocab_csv_path: "${paths.dict_path}/apertus_output_imp_merged/apertus_selected_val_0.8_seed_2_obs_3.1.csv"
output_dir: "${paths.log_dir}/train-probe/runs/2026-10-22_08-27-40/water_edit"

# Probe edit: the top_n positive-weight features closest to `terms` get a new fire weight.
edit:
  terms: ["river", "lake", "ocean", "sea", "water", "stream", "pond", "reservoir", "canal"]
  prompt_template: null  # null: raw terms | e.g. "A satellite view of {}"
  top_n: 20
  min_positive_weight: 0  # Only features with a fire weight above this value can be selected
  source: "term"  # term: nearest vocabulary term of the atom (needs an SAE vocabulary) | atom: SAE dictionary atom
  mode: "zero"  # zero: w = 0 | negative_percentile: w = -percentile of |w| over the negative weights
  percentile: 90  # Only used by negative_percentile
