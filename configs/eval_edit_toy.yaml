defaults:
  - global_config
  - probe: default.yaml
  - _self_

device: "cuda"
seed: 42

# Base MS-CLIP model
model_ckpt: "CLEAR_BUG_ORDER_NORM_MIXLOSS_MSCLIP_HIGH10X_SITS_ONLY/MSClipFacto-15-f1-0.47.ckpt"
model_path: "${paths.root_dir}/results/models/${model_ckpt}"
config_name: "config_file.yaml"

# Trained probe checkpoint. The probe configuration below points to its frozen SAE.
probe_checkpoint_path: "${paths.log_dir}/train-probe/runs/2026-11-05_22-11-16/checkpoints/epoch_019.ckpt"
probe:
  sae_ckpt_path: "${paths.log_dir}/train-sae/runs/2026-11-04_22-41-56/checkpoints/epoch_019.ckpt"
  alive_mask_path: "${paths.log_dir}/train-sae/runs/2026-11-04_22-41-56/alive_mask.pt"
MODEL:
  architecture: "MSClipFacto"
  out_H: 26
  out_W: 26
  input_img_res: 264
  img_res: 260
  test_max_seq_len: null

DATASETS:
  kwargs:
    mean_file: "${paths.msclip_bands_mean}"
    std_file: "${paths.msclip_bands_std}"
    with_loc: False
    with_doy: True
    use_msclip_norm: True
    trans_type: "msclip"
    bands:
      - B2
      - B3
      - B4
      - B5
      - B6
      - B7
      - B8
      - B8A
      - B11
      - B12
  train:
    paths: "${paths.split}"
    base_dir: ["${paths.pos_sits}", "${paths.neg_sits}"]
    label_dir: "${paths.label}"
    batch_size: 24
    num_workers: 8
  eval:
    paths: "${paths.split}"
    base_dir: ["${paths.pos_sits}", "${paths.neg_sits}"]
    label_dir: "${paths.label}"
    batch_size: 1
    num_workers: 1
    hard: False

# Optional CSV with a `term` column matching the SAE vocabulary embedding order.
vocab_csv_path: null #"${paths.dict_path}/apertus_output_imp_merged/apertus_selected_val_0.8_seed_2_obs_3.1.csv"
output_dir: "${paths.log_dir}/train-probe/runs/2026-11-05_22-11-16/water_edit"

# Probe edit: the top_n positive-weight features closest to `terms` get a new fire weight.
flag_test: True # If true, evaluate the edited probe on the test set as well. Otherwise, only on the validation set.
edit:
  terms: ["river", "lake", "ocean", "sea", "water", "stream", "pond", "reservoir", "canal"]
  prompt_template: null  # null: raw terms | e.g. "A satellite view of {}"
  selection: "hybrid"  # text: closest to `terms` | landcover: water score vs WorldCover | hybrid: top_n//2 text + rest landcover | random: baseline
  random_seed: null  # Only used by random selection; null falls back to the global seed
  top_n: 10
  min_positive_weight: 0.05  # Only features with a fire weight above this value can be selected
  source: "atom"  # term: nearest vocabulary term of the atom (needs an SAE vocabulary) | atom: SAE dictionary atom
  mode: "negative_percentile"  # zero: w = 0 | negative_percentile: w = -percentile of |w| over the negative weights
  percentile: 90  # Only used by negative_percentile
  # Used by selection = landcover | hybrid. Scores are computed on the lc_year tiles of the train split (no val leak),
  # from the post-TopK codes the probe uses. Entries are cached in output_dir, so changing score/percentile is cheap.
  landcover:
    score: "mass"  # corr: Pearson(z, water frac) | mass: sum(z*frac)/sum(z) | precision: water share of the feature's top tokens
    percentile: 99.9  # precision only: top (100 - percentile)% of all tokens per feature (all active tokens if fewer)
    pos_threshold: 0.5  # a token is water when its water fraction >= this
    min_active_tokens: 10000  # features active on fewer tokens cannot be selected (noisy scores)
    lc_year: 2020
    lc_dirs: ["/media/data/boreal_data/LC", "/media/data/boreal_data/NEG_LC"]  # indexed by file_id (0=POS, 1=NEG)
    water_ids: [18]
    max_samples: null  # debug cap on the number of tiles
    num_workers: 8
    recompute: False  # ignore the cached entries
